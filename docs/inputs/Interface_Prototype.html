$('#prevCV').onclick=()=>moveCandidate(index-1);$('#nextCV').onclick=()=>moveCandidate(index+1);$('#candidateSelect').onchange=e=>{S.candidate=e.target.value;S.sourceBlock=null;render()};$$('[data-value]').forEach(el=>el.onchange=()=>{let a=c.assessments[el.dataset.value];a.value=el.value;a.changed=true;if(a.value==='NOT_EVIDENCED')a.evidence=[];a.ack=false;c.attest=false;save();review()});$$('[data-evidencepick]').forEach(el=>el.onchange=()=>{c.assessments[el.dataset.evidencepick].evidence=el.value?[el.value]:[];c.assessments[el.dataset.evidencepick].ack=false;c.attest=false;save();review()});$$('[data-ack]').forEach(el=>el.onchange=()=>{c.assessments[el.dataset.ack].ack=el.checked;save();reviewReady()});$$('[data-note]').forEach(el=>el.oninput=()=>{c.assessments[el.dataset.note].note=el.value;save();reviewReady()});$$('[data-source]').forEach(el=>el.onclick=()=>{S.sourceBlock=el.dataset.source;$$('.block').forEach(x=>x.classList.toggle('focus',x.id==='block_'+S.sourceBlock));let node=$('#block_'+S.sourceBlock);node?.scrollIntoView({block:'nearest',behavior:'auto'});node?.focus({preventScroll:true});save()});if($('#sourceAck'))$('#sourceAck').onchange=e=>{c.sourceAck=e.target.checked;save();reviewReady()};if(!ro){$('#attest').onchange=e=>{c.attest=e.target.checked;save();reviewReady()};$('#confirmCV').onclick=()=>{if(blockers(c).length||batch().snapshot)return;c.done=true;c.confirmedAt=new Date().toISOString();b.selected=[];b.reason='';b.exceptionAck=false;let next=b.apps.find(x=>!x.done);if(next){S.candidate=next.id;S.sourceBlock=null;render();window.scrollTo(0,0);notify('Review saved. Next CV opened.')}else{S.step='shortlist';render();window.scrollTo(0,0);notify('Every CV is reviewed. Your shortlist is ready to choose.')}};reviewReady()}else{if($('#editReview'))$('#editReview').onclick=()=>{c.done=false;c.attest=false;b.selected=[];b.reason='';b.exceptionAck=false;render()};$('#continueNext').onclick=()=>{if(allReviewed()){S.step='shortlist';render()}else{S.candidate=b.apps.find(x=>!x.done).id;render()}}}}
function criterionCard(c,r,ro){let a=c.assessments[r.id],needed=requiredReview(c,r);return '<div class="card '+(a.disagree||a.value==='UNCLEAR'?'flagged':'')+'"><div class="cardtitle"><div><h3>'+E(r.title)+'</h3><div class="badges" style="margin-top:5px">'+(r.essential?'<span class="badge">Essential</span>':'')+(a.disagree?'<span class="badge warn">AI passes disagree</span>':'')+'</div></div><select aria-label="Assessment for '+E(r.title)+'" data-value="'+r.id+'" '+(ro?'disabled':'')+'>'+Object.keys(V).map(v=>'<option value="'+v+'" '+(a.value===v?'selected':'')+'>'+V[v]+'</option>').join('')+'</select></div><p class="rationale"><span class="tiny muted">'+(a.changed||a.value!==a.initial?'Original AI note':'AI note')+' · </span>'+E(a.rationale)+'</p>'+(a.evidence.length?a.evidence.map(id=>{let bl=c.blocks.find(x=>x.id===id);return '<div class="quote">“'+E(bl?.text||'Source reference unavailable')+'”<button class="link" data-source="'+E(id)+'">View source · '+E(id)+'</button></div>'}).join(''):'<p class="small muted">Not evidenced in this CV. Read the whole CV before confirming absence.</p>')+(needed?'<div class="rowfoot"><label class="check"><input data-ack="'+r.id+'" type="checkbox" '+(a.ack?'checked':'')+' '+(ro||a.value==='UNCLEAR'?'disabled':'')+'>I checked this '+(r.essential?'essential requirement':'assessment')+'.</label></div>':'')+((a.changed||a.value!==a.initial||a.disagree)?'<div class="changeNote">'+(['FULL','PARTIAL'].includes(a.value)?'<label for="evidence_'+r.id+'">Supporting source passage</label><select id="evidence_'+r.id+'" data-evidencepick="'+r.id+'" '+(ro?'disabled':'')+'><option value="">Choose source evidence</option>'+c.blocks.map(bl=>'<option value="'+E(bl.id)+'" '+(a.evidence.includes(bl.id)?'selected':'')+'>'+E(bl.id+' · '+bl.text.slice(0,60))+'</option>').join('')+'</select>':'')+'<label style="margin-top:9px" for="note_'+r.id+'">Your reason for this judgement</label><textarea id="note_'+r.id+'" data-note="'+r.id+'" rows="2" maxlength="600" '+(ro?'disabled':'')+' placeholder="Refer to what the evidence does or does not show.">'+E(a.note)+'</textarea></div>':'')+'</div>'}
function reviewReady(){if(!$('#confirmCV'))return;let b=blockers(candidate());$('#confirmCV').disabled=b.length>0;$('#reviewBlockers').textContent=b.length?b[0]:'All required checks are complete.'}
function moveCandidate(i){if(!batch().apps[i])return;S.candidate=batch().apps[i].id;S.sourceBlock=null;render();window.scrollTo(0,0)}
function ranked(){return [...batch().apps].sort((a,b)=>points(b)-points(a))}
function shortlist(){let b=batch();if(!allReviewed()){$('#stage').innerHTML='<div class="panel empty"><div class="emptyicon">'+icons.check+'</div><h2>Finish reviewing every CV first</h2><p class="muted small">'+(b.apps.length-b.apps.filter(c=>c.done).length)+' applications still need review. Ranking stays hidden so no candidate is overlooked.</p><button class="btn primary" id="returnReview">Continue review '+icons.arrow+'</button></div>';$('#returnReview').onclick=()=>{S.step=b.intakeClosed?'review':'cvs';S.candidate=b.apps.find(c=>!c.done)?.id;render()};return}let list=ranked(),tie=list.length>3&&points(list[2])===points(list[3]);$('#stage').innerHTML='<div class="sectionhead"><div><h2>'+(b.snapshot?'Your finalised shortlist':'Choose up to three candidates')+'</h2><p class="muted small">Scores use your confirmed assessments and the published criteria.</p></div><span class="badge good">'+(b.snapshot?'Finalised':'All '+b.apps.length+' CVs reviewed')+'</span></div>'+(tie&&!b.snapshot?'<div class="notice warn">Two or more candidates are tied at the shortlist boundary. Choose using the evidence and record the reason below.</div>':'')+'<div class="actions" style="justify-content:space-between;margin:18px 0"><button class="btn sm" id="revealNames">'+(b.reveal?'Hide names':'Reveal names')+'</button>'+(!b.snapshot?'<button class="btn sm" id="suggestTop">Select highest scores</button>':'<button class="btn sm" id="exportCSV">Export review CSV</button>')+'</div><div class="panel">'+list.map(c=>'<div class="rankitem '+(b.selected.includes(c.id)?'chosen':'')+'"><input type="checkbox" data-pick="'+E(c.id)+'" aria-label="Select applicant '+E(c.id)+'" '+(b.selected.includes(c.id)?'checked':'')+' '+(b.snapshot?'disabled':'')+'><div><strong>'+(b.reveal?E(c.name):'Applicant '+E(c.id))+'</strong><small>'+(b.reveal?E(c.id)+' · ':'')+(essentials(c).length?'Essential requirement not fully evidenced':'All essential requirements evidenced')+'</small></div><div class="score num">'+points(c)+'<small> / 100</small></div><button class="btn sm" data-evidence="'+E(c.id)+'">Evidence</button></div>').join('')+'</div><div class="field"><label for="selectionReason">Why this shortlist?</label><textarea id="selectionReason" rows="3" maxlength="1200" '+(b.snapshot?'disabled':'')+' placeholder="Explain your choice, including any tie or essential requirement exception.">'+E(b.reason)+'</textarea></div><div id="essentialException"></div><div class="bottomrow"><strong class="small" id="selectionCount"></strong><div class="actions">'+(b.snapshot?'<button class="btn primary" id="newBatch">Start next batch '+icons.arrow+'</button>':'<button class="btn primary" id="finalise">Finalise shortlist '+icons.check+'</button>')+'</div></div><p class="small muted" id="selectionHelp" role="status"></p><p class="footnote">Fewer than three is allowed. Finalising freezes this batch. This tool never sends rejection messages.</p>';
$('#revealNames').onclick=()=>{b.reveal=!b.reveal;render()};$$('[data-evidence]').forEach(el=>el.onclick=()=>{S.candidate=el.dataset.evidence;S.step='review';render()});$$('[data-pick]').forEach(el=>el.onchange=()=>{if(el.checked&&b.selected.length===3){el.checked=false;notify('Choose up to three candidates.');return}b.selected=el.checked?[...b.selected,el.dataset.pick]:b.selected.filter(id=>id!==el.dataset.pick);b.exceptionAck=false;save();$$('.rankitem').forEach(r=>r.classList.toggle('chosen',b.selected.includes(r.querySelector('[data-pick]').dataset.pick)));selectionReady()});$('#selectionReason').oninput=e=>{b.reason=e.target.value;save();selectionReady()};if($('#suggestTop'))$('#suggestTop').onclick=()=>{if(tie){let cutoff=points(list[2]);b.selected=list.filter(c=>points(c)>cutoff).map(c=>c.id);notify('Higher scores selected. Choose between the tied candidates.')}else b.selected=list.slice(0,3).map(c=>c.id);b.exceptionAck=false;render()};if($('#finalise'))$('#finalise').onclick=finalise;if($('#newBatch'))$('#newBatch').onclick=newBatch;if($('#exportCSV'))$('#exportCSV').onclick=exportCSV;selectionReady()}
function selectionReady(){let b=batch(),exceptions=b.selected.map(id=>b.apps.find(c=>c.id===id)).filter(c=>essentials(c).length);$('#selectionCount').textContent=b.selected.length+' of 3 selected';let html=exceptions.length?'<div class="notice warn"><div><strong>Essential requirement exception</strong><p>'+exceptions.map(c=>'Applicant '+E(c.id)).join(', ')+' does not fully evidence every essential requirement.</p><label class="check"><input id="exceptionAck" type="checkbox" '+(b.exceptionAck?'checked':'')+' '+(b.snapshot?'disabled':'')+'>My selection reason explains this exception.</label></div></div>':'';if($('#essentialException').innerHTML!==html)$('#essentialException').innerHTML=html;if($('#exceptionAck'))$('#exceptionAck').onchange=e=>{b.exceptionAck=e.target.checked;save();selectionReady()};if($('#selectionHelp'))$('#selectionHelp').textContent=b.snapshot?'This batch is finalised. Export or start the next batch.':b.reason.trim().length<12?'Add a short reason before finalising.':exceptions.length&&!b.exceptionAck?'Confirm the essential requirement exception above.':'Ready to finalise. Your choices and reason will be saved.';if($('#finalise'))$('#finalise').disabled=!allReviewed()||b.selected.length>3||b.reason.trim().length<12||(exceptions.length&&!b.exceptionAck)}
function finalise(){let b=batch();if($('#finalise').disabled)return;openDialog('Finalise this batch?','<p>You have selected <strong>'+b.selected.length+' candidate'+(b.selected.length===1?'':'s')+'</strong> after reviewing all '+b.apps.length+' CVs.</p><p class="small muted">This freezes the assessments, criteria and selection reason. The next group of CVs will use a new batch.</p>','<button class="btn" id="cancelFinal">Keep reviewing</button><button class="btn primary" id="confirmFinal">Finalise batch</button>');$('#cancelFinal').onclick=()=>$('#dialog').close();$('#confirmFinal').onclick=()=>{if(!allReviewed())return;b.snapshot={at:new Date().toISOString(),selected:[...b.selected],reason:b.reason,rubric:clone(config().rubric),assessments:b.apps.map(c=>({id:c.id,score:points(c),assessments:clone(c.assessments)}))};$('#dialog').close();render();notify('Shortlist finalised. Export is ready.')}}
function newBatch(){let j=job();openDialog('Start the next batch','<div class="field"><label for="batchLabel">Batch name</label><input id="batchLabel" class="input" value="Next weekly batch" maxlength="90"></div><p class="small muted">The finalised batch stays available. Published criteria are copied and can be edited before adding new CVs.</p>','<span></span><button class="btn primary" id="createBatch">Create batch</button>');$('#createBatch').onclick=()=>{let label=$('#batchLabel').value.trim();if(!label)return;let b={id:'b'+Date.now(),label,rubric:clone(config(j).rubric),published:true,intakeClosed:false,apps:[],selected:[],reason:'',exceptionAck:false,reveal:false,snapshot:null};j.batches.push(b);j.activeBatch=b.id;S.step='cvs';S.candidate=null;$('#dialog').close();render()}}
function cell(v){let s=String(v??'');if(/^[\s]*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){let b=batch(),j=job();if(!b.snapshot)return;let rows=[['DEMO DATA ONLY','Vacancy','Batch','Applicant ID','Confirmed score','Selected','Selection reason'],...b.apps.map(c=>['Fictional applicant',j.title,b.label,c.id,points(c),b.selected.includes(c.id)?'Yes':'No',b.reason])];let url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Shortlist_Synthetic_Review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);notify('Synthetic review exported. Names are excluded from this export.')}
function newVacancy(){openDialog('Create a vacancy','<div class="field"><label for="vacancyTitle">Job title</label><input id="vacancyTitle" class="input" maxlength="100" placeholder="For example: Customer success manager"></div><div class="field"><label for="vacancyDepartment">Team or department <span class="muted">(optional)</span></label><input id="vacancyDepartment" class="input" maxlength="70" placeholder="For example: Customer experience"></div><div class="field"><label for="vacancyJD">Job description</label><textarea id="vacancyJD" rows="4" maxlength="6000" placeholder="Paste the responsibilities and requirements."></textarea></div><p class="tiny muted">Demo: starts with editable example criteria, not an AI generated rubric.</p>','<span class="tiny muted">No real personal data</span><button class="btn primary" id="createVacancy">Create vacancy</button>');$('#createVacancy').onclick=()=>{let title=$('#vacancyTitle').value.trim(),department=$('#vacancyDepartment').value.trim(),jd=$('#vacancyJD').value.trim();if(!title)return notify('Enter a job title.');department=department||'Hiring team';let id='j'+Date.now(),bid='b'+Date.now();S.jobs.push({id,title,department,jd,rubric:rubric(),published:false,batches:[{id:bid,label:'First batch',intakeClosed:false,apps:[],selected:[],reason:'',exceptionAck:false,reveal:false,snapshot:null}],activeBatch:bid});S.current=id;S.page='workspace';S.step='criteria';$('#dialog').close();render()}}
function help(){openDialog('A simpler way to review CVs','<div class="helpgrid"><div><h3>1. Set criteria</h3><p class="small muted">Approve observable requirements, grouped into sections totalling 100 points.</p></div><div><h3>2. Add CVs</h3><p class="small muted">Choose the vacancy and close intake once the whole batch is present.</p></div><div><h3>3. Review evidence</h3><p class="small muted">Check essentials and uncertain results. Confirm each CV once and move to the next.</p></div><div><h3>4. Finalise</h3><p class="small muted">See confirmed scores, choose up to three, record the reason and export.</p></div></div><div class="notice neutral">This is an interface demonstration. Authentication, real parsing, AI calls, secure storage and server enforcement are specified separately and are not implemented here.</div>')}
$('#homeNav').onclick=()=>{S.page='home';render()};$('#newNav').onclick=newVacancy;$('#helpNav').onclick=help;$('#reset').onclick=()=>{openDialog('Reset this demonstration?','<p>This removes your fictional local changes and restores the original six sample CVs.</p>','<button class="btn" id="cancelReset">Cancel</button><button class="btn primary" id="confirmReset">Reset demo</button>');$('#cancelReset').onclick=()=>$('#dialog').close();$('#confirmReset').onclick=()=>{S=seed();$('#dialog').close();render();notify('Fictional workspace reset.')}};
// Public state is not a security boundary in a local interface demo. Production must recheck all transitions server side.
render();
</script></body></html>
